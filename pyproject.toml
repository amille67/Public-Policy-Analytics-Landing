[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ppa"
version = "0.2.0"
description = "Python reimplementation and national-scale extensions of Ken Steif's Public Policy Analytics case studies"
requires-python = ">=3.11"
license = { text = "MIT" }
readme = "README.md"
keywords = ["geospatial", "public-policy", "geopandas", "machine-learning", "urban-analytics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyproj>=3.6",
    "rtree>=1.1",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "joblib>=1.3",
    "requests>=2.31",
    "tenacity>=8.2",
    "dask[dataframe]>=2024.1",
    "distributed>=2024.1",
    "dask-geopandas>=0.3.0",
    "osmnx>=1.9",
    "python-dotenv>=1.0",
    "rich>=13",
    # --- added for Streamlit + Socrata + viz ---
    "sodapy>=2.5",
    "streamlit>=1.38",
    "pydeck>=0.8",
    "altair>=5.0",
]

[project.optional-dependencies]
raster = [
    "rasterio>=1.3",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "black>=23",
    "mypy>=1.7",
    "pre-commit>=3.5",
    "types-PyYAML>=6",
    "types-requests>=2.31",
    "pandas-stubs>=2.1",
    "nbqa>=1.7",
    "jupytext>=1.16",
]
notebooks = [
    "jupyterlab>=4.0",
    "jupytext>=1.16",
    "nbqa>=1.7",
]

[project.urls]
Homepage = "https://github.com/urbanSpatial/Public-Policy-Analytics-Landing"
Book = "https://urbanspatial.github.io/PublicPolicyAnalytics/"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ppa*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "SIM", "RUF"]
ignore = [
    "B905",   # zip() without strict= — ML/data code; False is the safe default
]

[tool.ruff.lint.isort]
known-first-party = ["ppa", "national", "chapters"]

[tool.ruff.lint.per-file-ignores]
"src/ppa/ml/*.py" = ["N803", "N806"]   # X, C, X_train etc. are ML conventions
"src/ppa/geo/buffers.py" = ["N806"]
"chapters/*.py" = ["N806"]
"national/**/*.py" = ["N806"]
"tests/**/*.py" = ["N803", "N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "integration: marks tests requiring external data or network (deselect with '-m \"not integration\"')",
]
