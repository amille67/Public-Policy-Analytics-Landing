[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "public-policy-analytics"
version = "0.1.0"
description = "Python rebuild of Public Policy Analytics case studies"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "joblib>=1.3",
    "rich>=13",
]

[project.optional-dependencies]
geo = [
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyproj>=3.6",
    "rtree>=1.1",
]
raster = [
    "rasterio>=1.3",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "black>=23",
    "mypy>=1.7",
    "pre-commit>=3.5",
    "types-PyYAML>=6",
    "pandas-stubs>=2.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "SIM", "RUF"]
ignore = [
    "B905",   # zip() without strict= — ML/data code; False is the safe default
]

[tool.ruff.lint.per-file-ignores]
"src/ppa/ml/*.py" = ["N803", "N806"]   # X, C, X_train etc. are ML conventions
"src/ppa/geo/buffers.py" = ["N806"]
"chapters/*.py" = ["N806"]
"tests/**/*.py" = ["N803", "N806"]
